version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: pomodoro
    ports:
      - '5432:5432'
    networks:
      - pomodoro-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./alembic/versions:/app/alembic/versions

  cache:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'
    networks:
      - pomodoro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888
    networks:
      - pomodoro-net

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
      - "29093:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      - zookeeper
    networks:
      - pomodoro-net


  schemaregistry:
    image: pravega/schemaregistry
    restart: always
    depends_on:
      - zookeeper
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: "zoo1:2181"
      SCHEMA_REGISTRY_HOST_NAME: schemaregistry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8085"
    ports:
      - 18085:8085
    networks:
      - pomodoro-net

  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0-SNAPSHOT
    depends_on:
      - kafka
      - schemaregistry
    ports:
      - 19000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      CMD_ARGS: "--message.format=AVRO --message.keyFormat=DEFAULT --schemaregistry.connect=http://schemaregistry:8085"
    networks:
      - pomodoro-net


  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
    container_name: pomodoro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pomodoro-net
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5051:80'
    networks:
      - pomodoro-net
    depends_on:
      - db
    links:
      - db:db

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    networks:
      - pomodoro-net
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/pomodoro
    volumes:
      - ./database:/app/database
      - ./alembic:/app/alembic
      - ./alembic/versions:/app/alembic/versions
      - ./init_data:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - pomodoro-net
    restart: on-failure
    depends_on:
      - db
      - migrations
      - cache
      - rabbitmq
      - kafka
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/pomodoro
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      BROKER_URL: kafka:9092
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local

networks:
  pomodoro-net:
    driver: bridge
